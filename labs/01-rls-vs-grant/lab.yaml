slug: 01-rls-vs-grant
phase: D
title: '"RLS is broken" — missing GRANT behind a correct policy'
difficulty: easy
est_minutes: 20
topics: [rls-vs-grants, sqlstate-42501, postgrest-role-switching, policy-select]
persistent_steps: [grant]          # the fix may be committed by the runner
hypotheses:
